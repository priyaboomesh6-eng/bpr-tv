
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPR-TV - Premium OTT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,Arial}
header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:#111;position:sticky;top:0;z-index:20}
.logo{color:#e50914;font-size:28px;font-weight:900;letter-spacing:1px}
.search{padding:8px 14px;border-radius:20px;border:none;width:150px;background:#222;color:#fff;outline:none}
.hero{height:60vh;background:linear-gradient(rgba(0,0,0,.2),#000 90%),url(https://image.tmdb.org/t/p/original/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg);background-size:cover;background-position:center;display:flex;align-items:end;padding:25px}
.hero h1{font-size:32px} .hero p{opacity:.8;margin:8px 0}
.btn{background:#e50914;color:#fff;padding:11px 26px;border:none;border-radius:4px;font-weight:bold;font-size:15px}
.row{padding:18px 20px} .row h2{margin-bottom:12px}
.cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.cards::-webkit-scrollbar{display:none}
.card{min-width:145px;height:210px;background:#1a1a1a;border-radius:10px;overflow:hidden;position:relative;flex-shrink:0;border:1px solid #222}
.card img{width:100%;height:100%;object-fit:cover}
.card-title{position:absolute;bottom:0;background:linear-gradient(transparent,#000);width:100%;padding:10px 8px;font-size:13px;font-weight:600}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;justify-content:center;align-items:center;flex-direction:column;padding:20px}
#player video{width:100%;max-width:900px;border-radius:12px;background:#111}
.close{position:absolute;top:18px;right:18px;font-size:32px;color:#fff;background:rgba(255,255,255,.15);border:none;width:44px;height:44px;border-radius:50%}
</style>
</head>
<body>
<header><div class="logo">BPR-TV</div><input class="search" id="search" placeholder="Search movies..." onkeyup="searchM()"></header>

<div class="hero">
<div>
<h1>BPR-TV Originals 4K</h1>
<p>Tamil | Telugu | English | Hindi - Watch Now Free</p>
<br>
<button class="btn" onclick="playM()">▶ Play Now</button>
</div>
</div>

<div class="row"><h2>🔥 Trending Now</h2>
<div class="cards">
<div class="card" onclick="playM()"><img src="https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg"><div class="card-title">Inception</div></div>
<div class="card" onclick="playM()"><img src="https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7ASAIDr3.jpg"><div class="card-title">Oppenheimer</div></div>
<div class="card" onclick="playM()"><img src="https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg"><div class="card-title">The Batman</div></div>
<div class="card" onclick="playM()"><img src="https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg"><div class="card-title">Interstellar</div></div>
<div class="card" onclick="playM()"><img src="https://image.tmdb.org/t/p/w500/qW4crfED8mpNDadSmMdi7ZDzhXF.jpg"><div class="card-title">Dune</div></div>
</div></div>

<div class="row"><h2>💎 BPR-TV Originals</h2>
<div class="cards">
<div class="card" onclick="playM()"><img src="https://image.tmdb.org/t/p/w500/3V4kLQg0kFFjRfyY5v2LwX1s0o.jpg"><div class="card-title">Leo - Tamil</div></div>
<div class="card" onclick="playM()"><img src="https://image.tmdb.org/t/p/w500/kDp1vUBnMpe8ak4rjgl3cLELqjU.jpg"><div class="card-title">Jailer</div></div>
<div class="card" onclick="playM()"><img src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg"><div class="card-title">Dune 2</div></div>
</div></div>

<div id="player">
<button class="close" onclick="closeP()">✕</button>
<video controls id="vid" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
<h3 style="margin-top:14px">Now Playing - BPR-TV Premium</h3>
<p style="opacity:.6;margin-top:4px">4K Ultra HD | Dolby Atmos</p>
</div>

<script>
function playM(){document.getElementById('player').style.display='flex';document.getElementById('vid').play()}
function closeP(){document.getElementById('player').style.display='none';document.getElementById('vid').pause()}
function searchM(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none'})}
</script>
</body>
</html>
