<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #111; color: #fff; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; position: fixed; width: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 10; }
    .logo { color: #e50914; font-size: 28px; font-weight: bold; letter-spacing: 2px; }
    .signin-btn { background: #e50914; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .hero { height: 75vh; background: linear-gradient(to top, #111 10%, rgba(0,0,0,0.4) 90%), url('https://unsplash.com') center/cover; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; }
    .hero h1 { font-size: 48px; max-width: 600px; margin-bottom: 16px; }
    .hero p { font-size: 18px; max-width: 500px; margin-bottom: 24px; color: #ddd; }
    .hero-buttons button { padding: 10px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; margin-right: 12px; cursor: pointer; }
    .play-btn { background: #fff; color: #000; }
    .info-btn { background: rgba(109, 109, 110, 0.7); color: #fff; }
    .row { padding: 20px 40px; }
    .row h2 { margin-bottom: 12px; font-size: 20px; }
    .posters { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
    .poster { min-width: 160px; height: 240px; background: #222; border-radius: 6px; display: flex; align-items: flex-end; padding: 12px; font-weight: bold; transition: transform 0.3s; cursor: pointer; }
    .poster:hover { transform: scale(1.08); background: #333; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">NETFLIX</div>
    <button class="signin-btn">Sign In</button>
  </div>

  <div class="hero">
    <h1>Featured Title</h1>
    <p>Stream unlimited movies and TV shows on your phone, tablet, laptop, and TV.</p>
    <div class="hero-buttons">
      <button class="play-btn">▶ Play</button>
      <button class="info-btn">ⓘ More Info</button>
    </div>
  </div>

  <div class="row">
    <h2>Trending Now</h2>
    <div class="posters">
      <div class="poster">Movie 1</div>
      <div class="poster">Movie 2</div>
      <div class="poster">Movie 3</div>
      <div class="poster">Movie 4</div>
      <div class="poster">Movie 5</div>
      <div class="poster">Movie 6</div>
    </div>
  </div>
</body>
</html>
