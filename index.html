<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPR-TV 🔴 - priyadharsini boomesh</title>
<link rel="icon" href="https://i.imgur.com/BPRlogo.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:white;font-family:Arial;overflow-x:hidden}
  /* INTRO ANIMATION - NEE KETTA MASS INTRO DA K */
  #intro{position:fixed;top:0;left:0;width:100%;height:100vh;background:#000;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;animation:introOut 1s ease 3.5s forwards}
  .bpr-big{font-size:130px;font-weight:900;color:#E50914;letter-spacing:-8px;text-shadow:0 0 40px red;animation:bprBoom 2.5s cubic-bezier(0.175,0.885,0.32,1.275)}
  .bpr-small{font-size:13px;letter-spacing:7px;color:#fff;opacity:0;animation:smallIn 1s ease 2s forwards;margin-top:5px}
  @keyframes bprBoom{0%{transform:scale(0.2) rotateX(90deg);opacity:0;filter:blur(20px)}40%{transform:scale(1.3);opacity:1;filter:blur(0)}60%{transform:scale(0.9)}100%{transform:scale(1)}}
  @keyframes smallIn{0%{opacity:0;transform:translateY(20px);letter-spacing:15px}100%{opacity:0.7;transform:translateY(0);letter-spacing:7px}}
  @keyframes introOut{to{transform:translateY(-100%);opacity:0}}
  
  /* NETFLIX HEADER */
  header{display:flex;justify-content:space-between;padding:20px 50px;align-items:center}
  .logo{font-size:32px;font-weight:900;color:#E50914}
  .logo span{font-size:10px;color:#fff;display:block;letter-spacing:3px}
  .nav button{background:#E50914;color:white;border:none;padding:8px 20px;border-radius:4px;margin-left:10px;cursor:pointer;font-weight:bold}
  
  /* MOVIE ROWS */
  .banner{height:60vh;background:linear-gradient(to bottom, transparent, #000), url('https://i.imgur.com/FFbanner.jpg');background-size:cover;display:flex;align-items:end;padding:50px}
  .row{padding:20px 50px}
  .row h3{margin-bottom:10px}
  .movies{display:flex;gap:10px;overflow-x:auto}
  .movie{min-width:150px;height:220px;background:#181818;border-radius:6px;display:flex;justify-content:center;align-items:center;transition:0.3s}
  .movie:hover{transform:scale(1.08);border:2px solid #E50914}

  /* ADMIN ICON STYLE */
  .icon-circle{width:45px;height:45px;background:#E50914;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:20px;box-shadow:0 0 15px rgba(229,9,20,0.6)}
</style>
</head>
<body>

<!-- MASS INTRO - NEE KETTA ANIMATION DA K -->
<div id="intro" onclick="playTudum()">
  <h1 class="bpr-big">BPR</h1>
  <p class="bpr-small">priyadharsini boomesh</p>
  <p style="margin-top:20px;font-size:11px;opacity:0.5">🔊 Click for sound</p>
</div>

<header>
  <div class="logo">BPR<span>priyadharsini boomesh</span></div>
  <div class="nav">
    <button onclick="location.href='/admin.html'">ADMIN 👑</button>
    <button style="background:white;color:black" onclick="playTudum()">🔊 INTRO</button>
  </div>
</header>

<div class="banner">
  <div><h1 style="font-size:50px">BPR-TV OTT</h1><p>Live • Videos • Game Live</p><button style="background:#E50914;color:white;border:none;padding:12px 25px;margin-top:15px;border-radius:4px;font-weight:bold">▶️ PLAY LIVE</button></div>
</div>

<div class="row"><h3>🔴 Continue Watching</h3><div class="movies"><div class="movie">Free Fire Live</div><div class="movie">Vlog</div><div class="movie">Game Play</div></div></div>
<div class="row"><h3>🔥 Trending Now</h3><div class="movies"><div class="movie">BPR Original</div><div class="movie">Live 1</div><div class="movie">Live 2</div></div></div>

<script>
function playTudum(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.frequency.setValueAtTime(120,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(35,ctx.currentTime+0.6);
  gain.gain.setValueAtTime(1,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+1.2);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+1.2);
  document.getElementById('intro').style.display='flex';
  document.getElementById('intro').style.animation='none';
  setTimeout(()=>{document.getElementById('intro').style.animation='introOut 1s ease 3.5s forwards'},100);
  setTimeout(()=>{document.getElementById('intro').style.display='none'},4500);
}
// Auto hide intro after 4 sec
setTimeout(()=>{document.getElementById('intro').style.display='none'},4000);
</script>
</body>
</html>
