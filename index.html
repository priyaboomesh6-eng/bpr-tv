<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>BPR 3D Tamil Nadu</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>*{margin:0;overflow:hidden;touch-action:none}body{background:#000}#joy{position:fixed;bottom:20px;left:15px;width:120px;height:120px;background:rgba(255,255,255,.15);border-radius:50%;z-index:10}#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;background:#fff;border-radius:50%}#fire{position:fixed;bottom:20px;right:15px;width:90px;height:90px;background:radial-gradient(red,darkred);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;border:3px solid #fff;z-index:10}#info{position:fixed;top:10px;left:10px;color:#fff;font-family:Arial Black;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:20px;font-size:12px;z-index:10}</style></head><body>
<div id="info">🔥 BPR 3D - TAMIL NADU MAP<br>❤️ <span id="hp">200</span> | KILL <span id="kill">0</span></div>
<div id="joy"><div id="stick"></div></div><div id="fire">FIRE</div>
<script>
let scene=new THREE.Scene();scene.fog=new THREE.Fog(0x87CEEB,50,300);
let camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.background=new THREE.Color(0x87CEEB);

// Light - Rich look
let sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(50,80,50);scene.add(sun);scene.add(new THREE.AmbientLight(0xffffff,0.6));

// Ground - Vayal + Beach
let ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:0x3a8a2a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
let beach=new THREE.Mesh(new THREE.PlaneGeometry(600,100),new THREE.MeshStandardMaterial({color:0xf5deb3}));beach.rotation.x=-Math.PI/2;beach.position.set(0,0.1,250);scene.add(beach);
let sea=new THREE.Mesh(new THREE.PlaneGeometry(600,100),new THREE.MeshStandardMaterial({color:0x1e90ff}));sea.rotation.x=-Math.PI/2;sea.position.set(0,-0.2,350);scene.add(sea);

// Temple Gopuram - Center - Rich
function temple(x,z){
  let g=new THREE.Group();
  let base=new THREE.Mesh(new THREE.BoxGeometry(20,12,20),new THREE.MeshStandardMaterial({color:0x8b5a2b}));base.position.y=6;g.add(base);
  for(let i=0;i<5;i++){let tower=new THREE.Mesh(new THREE.BoxGeometry(16-i*2,6,16-i*2),new THREE.MeshStandardMaterial({color:i%2?0xff6600:0x3399ff}));tower.position.y=15+i*6;g.add(tower);}
  g.position.set(x,0,z);scene.add(g);return g;
}
let kovil=temple(0,0);

// Houses - Tamil Nadu style
for(let i=0;i<20;i++){let h=new THREE.Mesh(new THREE.BoxGeometry(8,6,8),new THREE.MeshStandardMaterial({color:0xd2a679}));h.position.set(Math.random()*400-200,3,Math.random()*400-200);if(h.position.distanceTo(new THREE.Vector3(0,0,0))>30)scene.add(h);}
for(let i=0;i<30;i++){let tree=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.8,8),new THREE.MeshStandardMaterial({color:0x8b4513}));tree.position.set(Math.random()*400-200,4,Math.random()*400-200);scene.add(tree);let leaves=new THREE.Mesh(new THREE.SphereGeometry(3),new THREE.MeshStandardMaterial({color:0x228B22}));leaves.position.copy(tree.position);leaves.position.y+=6;scene.add(leaves);}

// Player
let player=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(1.5,3,1),new THREE.MeshStandardMaterial({color:0x0066ff}));body.position.y=1.5;player.add(body);player.position.set(0,0,40);scene.add(player);
let enemies=[];for(let i=0;i<8;i++){let e=new THREE.Mesh(new THREE.BoxGeometry(1.5,3,1),new THREE.MeshStandardMaterial({color:0xff0000}));e.position.set(Math.random()*300-150,1.5,Math.random()*300-150);e.userData={hp:100};scene.add(e);enemies.push(e);}

let hp=200,kills=0,keys={},joy={x:0,y:0,active:false},bullets=[];
camera.position.set(0,15,25);camera.lookAt(player.position);

function loop(){
  requestAnimationFrame(loop);
  // Move
  let move=new THREE.Vector3(joy.x,0,joy.y).multiplyScalar(0.4);
  move.x+= (keys['d']?0.4:0) - (keys['a']?0.4:0);
  move.z+= (keys['s']?0.4:0) - (keys['w']?0.4:0);
  player.position.add(move);
  player.rotation.y=Math.atan2(move.x,move.z);
  camera.position.x+= (player.position.x - camera.position.x + 0)*0.1;
  camera.position.z+= (player.position.z + 25 - camera.position.z)*0.1;
  camera.lookAt(player.position);
  
  // Enemies chase
  enemies.forEach(e=>{
    let dir=new THREE.Vector3().subVectors(player.position,e.position).normalize().multiplyScalar(0.08);
    e.position.add(dir);e.lookAt(player.position);
    if(e.position.distanceTo(player.position)<2){hp-=0.3;document.getElementById('hp').innerText=Math.floor(hp);}
  });
  
  // Bullets
  bullets=bullets.filter(b=>{b.position.add(b.velocity);if(b.position.length()>400)return false;
    enemies.forEach((e,i)=>{if(b.position.distanceTo(e.position)<2){scene.remove(e);enemies.splice(i,1);kills++;document.getElementById('kill').innerText=kills;scene.remove(b);if(enemies.length==0){alert("BOOYAH DA K! 🏆");location.reload();}}});return true;
  });
  
  if(hp<=0){alert("ELIMINATED DA K!");location.reload();}
  renderer.render(scene,camera);
}
loop();

// Controls
onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;
let joyEl=document.getElementById('joy'),stick=document.getElementById('stick');
joyEl.addEventListener('touchmove',e=>{
  e.preventDefault();let r=joyEl.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60),d=Math.hypot(dx,dy);if(d>40){dx=dx/d*40;dy=dy/d*40;}stick.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/40;joy.y=dy/40;joy.active=true;
},{passive:false});
joyEl.addEventListener('touchend',()=>{stick.style.transform='translate(0,0)';joy.x=joy.y=0;});
document.getElementById('fire').addEventListener('touchstart',e=>{
  e.preventDefault();let b=new THREE.Mesh(new THREE.SphereGeometry(0.3),new THREE.MeshStandardMaterial({color:0xffff00}));b.position.copy(player.position);b.position.y+=1.5;b.velocity=new THREE.Vector3(0,0,-2).applyQuaternion(player.quaternion).multiplyScalar(2);bullets.push(b);scene.add(b);
});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></body></html>
