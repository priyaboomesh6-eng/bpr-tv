<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BPR TV - BOOYAH Lobby</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{overflow:hidden;background:#000;color:white}
/* ===== LOBBY ===== */
#lobby{position:fixed;inset:0;z-index:100;background:linear-gradient(#5eb8ff 0%, #aee2ff 45%, #7ec850 45%, #3a9a3a 100%);overflow:hidden}
#sun{position:absolute;top:20px;right:30px;width:70px;height:70px;background:#ffeb3b;border-radius:50%;box-shadow:0 0 40px #ffeb3b}
#mountain{position:absolute;top:12%;left:0;right:0;text-align:center;font-size:85px;opacity:.9;letter-spacing:-10px}
#village{position:absolute;bottom:28%;left:0;right:0;display:flex;justify-content:space-around;font-size:48px}
#ground{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(#8a5a2b,#5a3a1a);border-top:6px solid #ccc}
#leaf{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);font-size:50px;opacity:.25}
#char{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);font-size:110px;z-index:5;filter:drop-shadow(0 10px 10px rgba(0,0,0,.4))}
#char.dance{animation:dance 0.6s infinite alternate}
@keyframes dance{
 0%{transform:translateX(-50%) rotate(-10deg) translateY(0)}
 50%{transform:translateX(-50%) rotate(10deg) translateY(-20px)}
 100%{transform:translateX(-50%) rotate(-10deg) translateY(0) scale(1.1)}
}
#char.run{animation:run .3s infinite alternate}
@keyframes run{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-12px)}}
#lobbyTop{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;align-items:center;z-index:10}
#logo{font-size:28px;font-weight:900;text-shadow:2px 2px 0 #000;color:#ffcc00}
#logo span{color:white;font-size:14px;display:block}
#coins{background:rgba(0,0,0,.6);padding:8px 14px;border-radius:20px;font-weight:bold}
#playerName{position:absolute;top:70px;left:15px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:12px}
#timer{position:absolute;top:15px;right:15px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:10px;font-size:12px}
#emoteBar{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
#emoteBar button{background:rgba(255,255,255,.9);border:none;width:55px;height:55px;border-radius:50%;font-size:26px}
#startBtn{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);background:linear-gradient(#ffcc00,#ff6b00);color:#000;font-size:26px;font-weight:900;padding:16px 55px;border:4px solid white;border-radius:50px;box-shadow:0 5px 0 #b25e00;z-index:10}
#startBtn:active{transform:translateX(-50%) scale(.95)}
#lobbyBottom{position:absolute;bottom:115px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;font-size:12px;z-index:10}
#lobbyBottom div{background:rgba(0,0,0,.55);padding:8px 10px;border-radius:10px}
