<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPR FLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding-bottom:30px}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;position:fixed;top:0;width:100%;background:rgba(0,0,0,.95);z-index:10}
.logo{color:#e50914;font-size:30px;font-weight:900;letter-spacing:1px}
.logo span{color:#fff;font-size:10px;display:block;letter-spacing:3px}
.insta-top{color:#fff;text-decoration:none;font-weight:bold;font-size:14px}
.hero{height:62vh;background:linear-gradient(to top,#000 5%,transparent 60%),linear-gradient(90deg,#b71c1c,#ff6b00);display:flex;flex-direction:column;justify-content:flex-end;padding:20px;padding-top:70px}
.hero h1{font-size:46px;text-shadow:2px 2px 0 #000}
.hero p{margin:8px 0 15px;color:#ddd;font-size:14px}
button{padding:12px 22px;border:none;border-radius:5px;font-weight:900;font-size:14px;cursor:pointer}
.play{background:#fff;color:#000}
.mylistbtn{background:#e50914;color:#fff}
.row{padding:15px}
.row h2{margin-bottom:12px;font-size:19px}
.posters{display:flex;gap:12px;overflow-x:auto;padding-bottom:5px}
.poster{min-width:150px;height:220px;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:pointer}
.poster b{font-size:15px}
.poster span{font-size:11px;color:#ddd}
.addbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:#000;font-size:22px;padding:0;display:flex;align-items:center;justify-content:center}
.addbtn.added{background:#e50914;color:#fff}
.my-card{background:#1a1a1a;border:1px solid #e50914;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.mass-card{margin:15px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);padding:3px;border-radius:20px}
.mass-inner{background:#111;border-radius:17px;padding:20px;text-align:center}
.avatar{width:80px;height:80px;margin:0 auto;background:#e50914;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:35px;border:3px solid #fff}
.follow{display:block;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);color:#fff;text-decoration:none;padding:14px;border-radius:30px;font-weight:900;margin-top:12px}
/* VIDEO PLAYER */
#player{display:none;position:fixed;inset:0;background:#000;z-index:99;flex-direction:column;align-items:center;justify-content:center;padding:15px}
#player video{width:100%;max-width:600px;border-radius:10px}
.close{position:absolute;top:15px;right:15px;background:#e50914;color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:18px;padding:0}
</style>
</head>
<body>

<div class="navbar">
<div class="logo">BPR FLIX<span>BOOYAH KING</span></div
