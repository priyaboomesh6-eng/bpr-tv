<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRP TV - YouTube Maathiri</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#0f0f0f;color:#fff}
a{color:#fff;text-decoration:none}
/* TOP BAR - YOUTUBE MAATHIRI */
.top{position:fixed;top:0;width:100%;height:56px;background:#0f0f0f;display:flex;align-items:center;justify-content:space-between;padding:0 15px;z-index:100}
.logo{font-size:24px;font-weight:900;cursor:pointer}
.logo b{color:#ff0000}
.logo span{font-size:10px;background:#ff0000;padding:2px 5px;border-radius:4px;margin-left:4px}
.search-box{display:flex;flex:1;max-width:550px;margin:0 15px}
.search-box input{flex:1;padding:10px 15px;background:#121212;border:1px solid #303030;border-radius:20px 0 0 20px;color:#fff;outline:none;font-size:15px}
.search-box button{padding:10px 20px;background:#222;border:1px solid #303030;border-left:none;border-radius:0 20px 20px 0;color:#fff;cursor:pointer}
.top-right{display:flex;gap:10px;align-items:center}
.top-right button{background:#272727;border:none;color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:700}
.login-btn{background:#fff !important;color:#000 !important}
/* LAYOUT */
.main{display:flex;padding-top:56px}
/* SIDEBAR */
.sidebar{width:220px;min-width:220px;padding:12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.side-item{display:flex;gap:18px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.side-item:hover,.side-item.active{background:#272727}
.side-item b{font-size:16px}
.divider{height:1px;background:#272727;margin:10px 0}
.side-title{padding:10px 12px;font-size:15px;font-weight:700}
/* CONTENT */
.content{flex:1;padding:15px;overflow:hidden}
/* CHIPS */
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:15px;white-space:nowrap}
.chip{background:#272727;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer;flex-shrink:0}
.chip.active{background:#fff;color:#000}
/* VIDEO GRID - YOUTUBE */
.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{cursor:pointer}
.thumb{height:180px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:50px}
.thumb span{position:absolute;bottom:8px;right:8px;background:#000;font-size:12px;padding:3px 6px;border-radius:4px}
.card-info{display:flex;gap:10px;margin-top:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#e50914;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.card h4{font-size:15px;line-height:1.3}
.card p{font-size:13px;color:#aaa;margin-top:3px}
/* SHORTS */
.shorts-title{font-size:20px;font-weight:700;margin:25px 0 12px}
.shorts{display:flex;gap:12px;overflow-x:auto}
.short-card{min-width:150px;height:260px;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
/* LOGIN */
#loginPage{position:fixed;inset:0;background:#0f0f0f;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:380px;background:#212121;padding:25px;border-radius:15px;text-align:center}
.login-box input{width:100%;padding:13px;margin:8px 0;background:#121212;border:1px solid #303030;color:#fff;border-radius:20px;outline:none}
.login-box button{width:100%;padding:12px;border:none;border-radius:20px;font-weight:900;cursor:pointer;margin-top:8px}
/* PLAYER */
#player{display:none;position:fixed;inset:0;background:#000;z-index:998;flex-direction:column;padding:60px 15px 15px;overflow-y:auto}
#player video{width:100%;max-width:800px;margin:0 auto;border-radius:12px;display:block}
@media(max-width:900px){.sidebar{display:none}.videos{grid-template-columns:repeat(2,1fr)}.search-box{max-width:200px}}
