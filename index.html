<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPR TV - Netflix Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;overflow-x:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:linear-gradient(#000,transparent)}
#logo{color:#e50914;font-size:30px;font-weight:900;letter-spacing:-1px}
#logo span{color:#fff;font-size:12px}
nav{display:flex;gap:12px;font-size:13px}
nav b{color:#fff}
#search{width:140px;padding:7px 10px;border-radius:20px;border:none;background:#222;color:#fff;outline:none}
#hero{height:72vh;background:linear-gradient(180deg,transparent 40%,#000 100%),linear-gradient(90deg,#b71c1c,#ff6b00);display:flex;flex-direction:column;justify-content:flex-end;padding:20px;position:relative}
#hero h3{color:#e50914;letter-spacing:3px;font-size:13px}
#hero h1{font-size:48px;line-height:1;margin:8px 0}
#hero p{font-size:14px;color:#ddd;max-width:90%;line-height:1.5}
.btns{display:flex;gap:10px;margin-top:15px}
.btns button{padding:12px 22px;border:none;border-radius:5px;font-weight:900;font-size:15px}
#play{background:#fff;color:#000}
#info{background:rgba(255,255,255,.3);color:#fff}
.row{padding:12px 0 0 15px}
.row h2{font-size:18px;margin-bottom:10px}
.posters{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.posters::-webkit-scrollbar{display:none}
.poster{min-width:130px;height:185px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;cursor:pointer;transition:.2s;position:relative}
.poster:active
