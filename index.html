<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRP TV - Login & Local Cable Network</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0a0a0c;
      color: #ffffff;
      min-height: 100vh;
    }

    /* ================= LOGIN SCREEN STYLES ================= */
    #authScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.88)),
                  url('https://ytimg.com') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }

    .auth-box {
      background: rgba(20, 20, 24, 0.95);
      border: 1px solid #333;
      border-top: 4px solid #e50914;
      padding: 32px 28px;
      border-radius: 10px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .auth-logo span {
      background: #e50914;
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      padding: 5px 14px;
      border-radius: 5px;
      letter-spacing: 2px;
    }

    .auth-box h2 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
      color: #f3f4f6;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 11px 12px;
      background: #121216;
      border: 1px solid #3f3f46;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #e50914;
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: 0.2s;
    }

    .auth-btn:hover {
      background: #b90912;
    }

    .auth-links {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 13px;
    }

    .auth-links a {
      color: #ffb703;
      text-decoration: none;
      cursor: pointer;
    }

    .auth-links a:hover {
      text-decoration: underline;
    }

    .msg-box {
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
      color: #f87171;
      min-height: 18px;
    }

    /* ================= CABLE TV SCREEN STYLES ================= */
    #tvApp {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #141414, #1f1111, #141414);
      padding: 12px 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e50914;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      background: #e50914;
      color: #fff;
      font-weight: 900;
      font-size: 22px;
      padding: 4px 12px;
      border-radius: 4px;
      letter-spacing: 1.5px;
    }

    .live-badge {
      background: #ffb703;
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-badge {
      font-size: 13px;
      color: #46d369;
      font-weight: bold;
    }

    .logout-btn {
      background: #27272a;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #e50914;
    }

    .tv-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 16px 4%;
      flex: 1;
    }

    .screen-container {
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #262626;
      display: flex;
      flex-direction: column;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    iframe, video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .tv-watermark {
      position: absolute;
      top: 14px;
      right: 18px;
      background: rgba(229, 9, 20, 0.85);
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
    }

    .channel-osd {
      position: absolute;
      top: 14px;
      left: 18px;
      background: rgba(0, 0, 0, 0.8);
      border-left: 4px solid #ffb703;
      padding: 6px 12px;
      border-radius: 4px;
      z-index: 10;
    }

    .osd-num {
      color: #ffb703;
      font-size: 18px;
      font-weight: 900;
    }

    .osd-name {
      font-size: 13px;
      font-weight: 600;
    }

    .cable-ticker {
      background: #e50914;
      color: #fff;
      padding: 8px 0;
      font-weight: 700;
      font-size: 14px;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-text {
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 22s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .remote-bar {
      background: #16161a;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .remote-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn:hover {
      background: #e50914;
    }

    .btn-gold {
      background: #ffb703;
      color: #000;
      border: none;
    }

    .guide-panel {
      background: #141418;
      border-radius: 10px;
      border: 1px solid #262626;
      padding: 14px;
      display: flex;
      flex-direction: column;
      max-height: 540px;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #27272a;
    }

    .channel-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ch-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #1c1c22;
      border-radius: 6px;
      cursor: pointer;
      border-left: 4px solid transparent;
    }

    .ch-item:hover, .ch-item.active {
      background: #282832;
      border-left-color: #ffb703;
    }

    .ch-num {
      background: #e50914;
      color: #fff;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    .ch-title { font-size: 14px; font-weight: 700; }
    .ch-prog { font-size: 12px; color: #9ca3af; }

    /* Add Channel Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: #18181b;
      padding: 22px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      border: 1px solid #333;
    }

    .modal-box h3 { margin-bottom: 14px; color: #ffb703; }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #09090b;
      border: 1px solid #3f3f46;
      color: #fff;
      border-radius: 4px;
    }

    @media (max-width: 850px) {
      .tv-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ================= 1. LOGIN / REGISTER / FORGOT PASSWORD SCREEN ================= -->
  <div id="authScreen">
    <div class="auth-box">
      <div class="auth-logo"><span>BRP TV</span></div>
      <div class="msg-box" id="authMsg"></div>

      <!-- Login Form -->
      <div id="loginForm">
        <h2>Sign In to Cable TV</h2>
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="loginUser" placeholder="Enter username (Default: brp)" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="Enter password (Default: 1234)" />
        </div>
        <button class="auth-btn" onclick="handleLogin()">Login</button>
        <div class="auth-links">
          <a onclick="switchForm('forgotForm')">Forgot Password?</a>
          <a onclick="switchForm('registerForm')">Create New Account</a>
        </div>
      </div>

      <!-- Register Form -->
      <div id="registerForm" style="display:none;">
        <h2>New Friend Account</h2>
        <div class="input-group">
          <label>New Username</label>
          <input type="text" id="regUser" placeholder="Choose username" />
        </div>
        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="regPass" placeholder="Create password" />
        </div>
        <button class="auth-btn" onclick="handleRegister()">Register</button>
